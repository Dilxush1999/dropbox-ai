<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Dropbox AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <!-- PIN Set Screen (First Run / Change) -->
    <div id="screen-set-pin" class="screen glass hidden">
        <div class="content">
            <img src="img/logo.png" alt="Logo" class="app-logo">
            <h2 id="set-pin-title">Yangi PIN o'rnating</h2>
            <p id="set-pin-subtitle" class="subtitle">Ilovani himoya qilish uchun 4 xonali kod kiriting</p>
            <div class="pin-display">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
            <div class="numpad" id="numpad-set">
                <!-- Buttons 1-9 generated by JS -->
            </div>
            <div class="actions">
                <button id="btn-cancel-set" onclick="app.cancelPinSet()" class="btn-text hidden">Bekor qilish</button>
            </div>
        </div>
    </div>

    <!-- PIN Login Screen -->
    <div id="screen-login" class="screen glass hidden">
        <div class="content">
            <img src="img/logo.png" alt="Logo" class="app-logo">
            <h2>Xush kelibsiz</h2>
            <p id="lockout-timer" class="error-msg hidden">Qulflangan: <span id="timer-val">30</span>s</p>
            <div class="pin-display">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
            <div class="numpad" id="numpad-login">
                <!-- Buttons 1-9 generated by JS -->
            </div>
            <div class="actions">
                <button onclick="app.showSettings()" class="btn-text">Sozlamalar</button>
            </div>
        </div>
    </div>

    <!-- No Internet Screen -->
    <div id="screen-no-internet" class="screen glass hidden">
        <div class="content">
            <div class="icon-warning">⚠️</div>
            <h2>Internet aloqasi yo'q</h2>
            <p>Iltimos, tarmoqni tekshiring va qayta urinib ko'ring.</p>
            <button onclick="app.retryConnection()" class="btn-primary">Qayta urinish</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="modal-settings" class="modal glass hidden">
        <div class="modal-content">
            <h3>Sozlamalar</h3>
            <div class="setting-item">
                <span>Avto-qulflash:</span>
                <select id="select-autolock" onchange="app.updateAutoLock()">
                    <option value="0">Doim ochiq</option>
                    <option value="1">1 daqiqa</option>
                    <option value="5">5 daqiqa</option>
                    <option value="10">10 daqiqa</option>
                </select>
            </div>
            <div class="setting-item">
                <button onclick="app.changePinInitiate()" class="btn-secondary">PIN kodni o'zgartirish</button>
            </div>
            <div class="setting-item">
                <button onclick="app.clearCache()" class="btn-secondary">Keshni tozalash</button>
            </div>
            <div class="modal-actions">
                <button onclick="app.hideSettings()" class="btn-primary">Yopish</button>
            </div>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
